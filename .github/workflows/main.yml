name: Test

on:
  push:
    branches: [ master, 'feature-**', 'fix-**' ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: python -m pip install ".[tests]"
    - name: Lint
      run: make PY=python analyze
    - name: Test
      run: make PY=python test

  # Build the py2.py3 wheel, and test it (as pip would install it from PyPI) under CPython 2.7
  wheel-py27:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Build
      run: |
        python -m pip install ".[dev]"
        python -m build .
    - name: Test wheel under Python 2.7
      run: |
        docker run --rm -v "$PWD:/src:ro" python:2.7.18-slim sh -c '
            pip install --quiet --disable-pip-version-check "pytest < 5" /src/dist/*-py2.py3-none-any.whl &&
            cp -r /src/tests /src/examples /tmp && cd /tmp && python -m pytest -v tests'
